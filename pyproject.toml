[project]
name = "nano-hermes-agent"
version = "0.0.1"
description = "教程项目：从零搭建 AI Agent 工具系统"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# V10 mock 服务依赖 — agent 主进程不需要，运行 scripts/mock_memory_server.py 才装
mock-server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
]

[project.scripts]
nano-hermes = "agent:run_agent"
